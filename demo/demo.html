<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepStreamer — демо</title>
    <link rel="stylesheet" href="../src/styles/content.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0e; }
      /* Демо-панель управления = встроенный popup расширения (как в Chrome) */
      #demo-controls {
        position: fixed; z-index: 2147483002; top: 12px; left: 12px;
        width: 320px; max-height: 92vh; overflow: auto;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,.6);
        border: 1px solid rgba(255,255,255,.1);
      }
      #demo-controls iframe { width: 320px; height: 640px; border: 0; display: block; border-radius: 12px; }
      #demo-toggle {
        position: fixed; z-index: 2147483003; top: 12px; left: 12px;
        font: 12px -apple-system, Segoe UI, Roboto, sans-serif; color: #fff;
        background: linear-gradient(90deg,#4d6bfe,#8b5cf6); border: 0;
        padding: 8px 12px; border-radius: 8px; cursor: pointer; display: none;
      }
      #demo-hint {
        position: fixed; z-index: 2147483001; left: 50%; bottom: 8px;
        transform: translateX(-50%);
        font: 12px -apple-system, Segoe UI, Roboto, sans-serif;
        color: #8a8a92; background: rgba(0,0,0,.5); padding: 4px 10px;
        border-radius: 999px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="demo-hint">Демо-режим · панель управления слева (это и есть popup расширения)</div>

    <!-- Стаб chrome.* API -->
    <script src="chrome-stub.js"></script>

    <!-- Модули расширения (тот же порядок, что и в manifest) -->
    <script src="../src/lib/settings.js"></script>
    <script src="../src/lib/stream-state.js"></script>
    <script src="../src/content/dom-driver.js"></script>
    <script src="../src/content/parser.js"></script>
    <script src="../src/content/prompt-builder.js"></script>
    <script src="../src/content/tts.js"></script>
    <script src="../src/content/engine.js"></script>
    <script src="../src/content/orchestrator.js"></script>
    <script src="../src/content/ui.js"></script>
    <script src="../src/content/content.js"></script>

    <!-- Встроенный popup как панель управления. Он делит тот же chrome-стаб
         через общий контекст: демо-popup обращается к тем же модулям. -->
    <div id="demo-controls">
      <div id="popup-mount"></div>
    </div>
    <button id="demo-toggle">☰ Управление</button>

    <script src="demo-popup.js"></script>
  </body>
</html>
